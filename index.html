<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Block Mine</title>
<style>
:root{--bg:#171726;--panel:#24243d;--cell:#30304f;--glow:#2e2e5c;--text:#f2f2fa;--muted:#9a9ac0;--accent:#f0c030;--ok:#2fcf6a;--bad:#e5484d}
html.w1{--bg:#0d1a2a;--panel:#1a3350;--cell:#27496e;--glow:#235f8f;--accent:#7ad7ff;--muted:#8fb0cc}
html.w2{--bg:#211010;--panel:#4a231d;--cell:#653228;--glow:#7a2d10;--accent:#ff9a3d;--muted:#cfa08c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{background:var(--bg);background-image:radial-gradient(130% 55% at 50% 0%,var(--glow),transparent 72%),radial-gradient(90% 40% at 50% 100%,var(--glow),transparent 75%);background-attachment:fixed;min-height:100%}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;touch-action:manipulation}
.top{width:min(92vw,420px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--panel);border-radius:10px;padding:5px 8px;font-size:11px;color:var(--muted);line-height:1.2;min-width:0;white-space:nowrap;overflow:hidden}
.stat b{display:block;font-size:17px;color:var(--text);overflow:hidden;text-overflow:ellipsis}
.stat.en b{color:var(--accent)}
.stat.co b{color:#ffd24a}
.stat small{font-size:10px;color:var(--muted);font-weight:400;margin-left:3px}
.order{width:min(92vw,420px);display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:7px 12px;cursor:pointer;border:2px solid transparent}
.order.ready{border-color:var(--ok)}
.order img{width:38px;height:38px;image-rendering:pixelated;border-radius:4px}
.order .tx{flex:1;font-size:14px;line-height:1.25}
.order .tx span{color:var(--muted);font-size:12px;display:block}
#board{--bw:min(92vw,420px,calc((100dvh - 400px) * .8333));width:var(--bw);aspect-ratio:5/6;min-width:250px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);gap:4px;background:var(--panel);padding:6px;border-radius:14px}
.cell{position:relative;background:var(--cell);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;outline:3px solid transparent;transition:outline-color .12s}
.cell img{width:88%;height:88%;image-rendering:pixelated;border-radius:3px;display:none;pointer-events:none}
.cell b{position:absolute;right:5px;bottom:2px;font-size:11px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
.cell.sel{outline-color:var(--accent)}
.cell.pop img{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.btns,.sub{width:min(92vw,420px);display:flex;gap:6px}
button{font:inherit;border:0;border-radius:12px;padding:13px 8px;color:#1a1a1a;font-weight:700;font-size:15px;cursor:pointer;background:#ddd}
#mine{flex:1.4;background:var(--accent);font-size:16px}
#shop{flex:1;background:#8fb4ff;font-size:14px}
#ad{flex:1;background:var(--ok);font-size:13px}
.mini{flex:1;padding:8px 4px;font-size:12px;background:var(--panel);color:var(--text);border:1px solid #444466;border-radius:10px}
.mini.hl{border-color:var(--accent);color:var(--accent)}
#bSound{flex:.45;font-size:16px}
button:active{transform:scale(.97)}
.off{opacity:.45}
.coll{width:min(92vw,420px)}
.coll h4{margin:2px 0 5px;font-size:12px;color:var(--muted);font-weight:500}
.row{display:flex;gap:4px;justify-content:space-between}
.row img{width:9%;image-rendering:pixelated;border-radius:3px}
.row img.lock{filter:brightness(0) opacity(.35)}
.hint{width:min(92vw,420px);font-size:11px;color:var(--muted);text-align:center;line-height:1.35}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);background:#000d;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;transition:transform .25s;z-index:20;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.show{display:flex}
.box{background:var(--panel);border-radius:16px;padding:16px;width:min(92vw,380px);max-height:88dvh;overflow:auto}
.box h3{margin:0 0 10px;font-size:18px}
.mb{font-size:14px;line-height:1.45;white-space:pre-line;color:var(--text)}
.mf{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mf button.ok{background:var(--ok)}
.mf button.gold{background:var(--accent)}
.mf button.sec{background:#3c3c60;color:var(--text)}
.up{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #35355a}
.up:last-child{border-bottom:0}
.up .nm{flex:1;min-width:0}
.up .nm b{display:block;font-size:14px}
.up .nm span{display:block;font-size:12px;color:var(--muted)}
.up button{padding:9px 10px;font-size:13px;min-width:78px;background:#ffd24a}
.up button:disabled{opacity:.4}
.lb{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px;border-bottom:1px solid #35355a}
.coinline{font-size:14px;margin-bottom:6px;color:#ffd24a}
</style>
</head>
<body>
<div class="top">
  <div class="stat"><span id="lScore">Очки</span><b id="score">0</b></div>
  <div class="stat"><span id="lBest">Рекорд</span><b id="best">0</b></div>
  <div class="stat co"><span id="lCoins">Монеты</span><b id="coins">0</b></div>
  <div class="stat en"><span id="lEnergy">Энергия</span><b><span id="en">10</span><small id="timer"></small></b></div>
</div>
<div class="order" id="order">
  <img id="oimg" alt="">
  <div class="tx"><span id="lOrder">Заказ</span><div id="otext"></div></div>
</div>
<div id="board"></div>
<div class="btns">
  <button id="mine">Добыть</button>
  <button id="shop">Магазин</button>
  <button id="ad">+10 видео</button>
</div>
<div class="sub">
  <button class="mini hl" id="bDaily" hidden>Бонус</button>
  <button class="mini hl" id="bWorld" hidden>Новый мир</button>
  <button class="mini" id="bRating">Рейтинг</button>
  <button class="mini" id="bSound" aria-label="sound">🔊</button>
</div>
<div class="coll"><h4 id="lColl">Коллекция</h4><div class="row" id="coll"></div></div>
<div class="hint" id="hint"></div>
<div id="toast"></div>
<div class="modal" id="modal"><div class="box"><h3 id="mt"></h3><div class="mb" id="mb"></div><div class="mf" id="mf"></div></div></div>

<script src="/sdk.js"></script>
<script>
(() => {
'use strict';
const COLS = 5, ROWS = 6, N = COLS * ROWS, KEY = 'blockmine_v2', OLD = 'blockmine_v1', JUNK = 100, CRACK = 101, ABS_E = 99;
const WORLDS = [
  { ru:'Шахта', en:'Mine', t:[['#8b5a2b','Земля','Dirt'],['#8c8c8c','Камень','Stone'],['#3a3a44','Уголь','Coal'],['#d17a3d','Медь','Copper'],['#cfc8c0','Железо','Iron'],['#f0c030','Золото','Gold'],['#2fcf6a','Изумруд','Emerald'],['#dc2a40','Рубин','Ruby'],['#46e0e6','Алмаз','Diamond'],['#b45cff','Кристалл','Crystal']] },
  { ru:'Ледяные пещеры', en:'Ice Caves', t:[['#dfeef7','Снег','Snow'],['#9fd3ee','Лёд','Ice'],['#6f8aa8','Холодный камень','Cold stone'],['#2f5fd0','Сапфир','Sapphire'],['#29b6a8','Бирюза','Turquoise'],['#5be0d0','Аквамарин','Aquamarine'],['#cdd6ff','Лунный камень','Moonstone'],['#7ef4ff','Ледяной алмаз','Ice diamond'],['#7cf0b0','Сияние','Aurora'],['#f4f9ff','Звёздный лёд','Star ice']] },
  { ru:'Огненные недра', en:'Magma Depths', t:[['#6b6560','Пепел','Ash'],['#3b3b42','Базальт','Basalt'],['#d8c820','Сера','Sulfur'],['#2a1f3d','Обсидиан','Obsidian'],['#ff5a1f','Лава','Lava'],['#e03a10','Магма','Magma'],['#f0a020','Янтарь','Amber'],['#ff7a8a','Огненный опал','Fire opal'],['#ffd24a','Солнечный камень','Sunstone'],['#ff2a5a','Сердце вулкана','Volcano heart']] }
];
const I18N = {
  ru: { score:'Очки', best:'Рекорд', coins:'Монеты', energy:'Энергия', order:'Заказ', mine:'Добыть', ad:'+10 ⚡ видео', shop:'🛒 Магазин',
    rating:'🏆 Рейтинг', daily:'🎁 Бонус', world:'🌀 Новый мир', coll:'Коллекция',
    hint:'Нажмите на блок, затем на такой же — они сольются. Пустая клетка — блок переедет. Булыжники разбиваются слияниями рядом с ними. Поле заполнено и слияний нет — проигрыш.',
    noE:'Нет энергии. Подождите или посмотрите видео', full:'Поле заполнено — объединяйте блоки', done:'Заказ выполнен!', treasure:'Сокровище! +1000',
    adErr:'Реклама сейчас недоступна', got:'+10 ⚡', reward:'Награда: ⚡, монеты и очки', ready:'Нажмите, чтобы сдать',
    junk:'Булыжник. Сливайте блоки рядом — он разобьётся', overTitle:'Шахта обрушилась!', again:'Новая попытка', second:'🎬 Второй шанс (видео)',
    saved:'Поле расчищено!', close:'Закрыть', shopTitle:'Магазин улучшений', shopNote:'В каждом новом мире цены выше, а уровни улучшений уменьшаются вдвое.', maxed:'макс.', lvl:'ур.', off:'выкл', sec:'с',
    worldTitle:'Новый мир', go:'Перейти', stay:'Остаться', dailyTitle:'Ежедневный бонус', claim:'Забрать', claim2:'🎬 ×2 за видео',
    top:'Лучшие игроки', loading:'Загрузка…', noLb:'Рейтинг доступен в Яндекс Играх', login:'Войти, чтобы попасть в рейтинг',
    s_energy:['Запас энергии','больше блоков подряд'], s_regen:['Быстрая зарядка','энергия возвращается быстрее'],
    s_luck:['Удача','чаще выпадают блоки посильнее'], s_auto:['Автодобыча','сама кладёт блок на поле'],
    worldText:(n,m)=>`Перейти в мир «${n}»?\nПоле очистится, уровни улучшений уменьшатся вдвое, а цены вырастут. Монеты и коллекции сохранятся. Очки в новом мире ×${m}, играть станет чуть сложнее.`,
    dailyText:(d,c,e)=>`День ${d} из 7\n+${c} монет и +${e} ⚡`,
    overText:(s,b,c)=>`Поле заполнено, слияний нет.\nОчки: ${s}. Рекорд: ${b}.`+(c>0?`\nЗа забег: +${c} монет.`:'') },
  en: { score:'Score', best:'Best', coins:'Coins', energy:'Energy', order:'Order', mine:'Mine', ad:'+10 ⚡ video', shop:'🛒 Shop',
    rating:'🏆 Top', daily:'🎁 Bonus', world:'🌀 New world', coll:'Collection',
    hint:'Tap a block, then a matching one to merge. Tap an empty cell to move. Rocks break when you merge next to them. Board full with no merges — game over.',
    noE:'No energy. Wait or watch a video', full:'Board is full — merge some blocks', done:'Order complete!', treasure:'Treasure! +1000',
    adErr:'Ads are unavailable right now', got:'+10 ⚡', reward:'Reward: ⚡, coins and points', ready:'Tap to deliver',
    junk:'A rock. Merge blocks next to it to break it', overTitle:'The mine collapsed!', again:'Try again', second:'🎬 Second chance (video)',
    saved:'Board cleared!', close:'Close', shopTitle:'Upgrade shop', shopNote:'Each new world has higher prices, and upgrade levels are halved.', maxed:'max', lvl:'lv', off:'off', sec:'s',
    worldTitle:'New world', go:'Go', stay:'Stay', dailyTitle:'Daily bonus', claim:'Claim', claim2:'🎬 ×2 for video',
    top:'Top players', loading:'Loading…', noLb:'Leaderboard is available on Yandex Games', login:'Sign in to join the leaderboard',
    s_energy:['Energy cap','more blocks in a row'], s_regen:['Fast recharge','energy comes back faster'],
    s_luck:['Luck','stronger blocks appear more often'], s_auto:['Auto-mining','places a block on its own'],
    worldText:(n,m)=>`Go to “${n}”?\nThe board resets, upgrade levels are halved and prices go up. Coins and collections are kept. Points in the new world ×${m}, and it gets a bit harder.`,
    dailyText:(d,c,e)=>`Day ${d} of 7\n+${c} coins and +${e} ⚡`,
    overText:(s,b,c)=>`Board is full, no merges left.\nScore: ${s}. Best: ${b}.`+(c>0?`\nRun reward: +${c} coins.`:'') }
};
let lang = 'ru';
const t = (k, ...a) => { const v = I18N[lang][k]; return typeof v === 'function' ? v(...a) : v; };
const $ = id => document.getElementById(id);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ---------- upgrades ----------
const UPS = [
  { k:'energy', max:5, base:50,  eff:l => `${10+2*l} → ${10+2*(l+1)}` },
  { k:'regen',  max:5, base:60,  eff:l => `${regenSec(l)}${t('sec')} → ${regenSec(l+1)}${t('sec')}` },
  { k:'luck',   max:5, base:80,  eff:l => `${Math.round(luckP(l)*100)}% → ${Math.round(luckP(l+1)*100)}%` },
  { k:'auto',   max:5, base:120, eff:l => `${l===0?t('off'):(70-10*l)+t('sec')} → ${(70-10*(l+1))}${t('sec')}` }
];
const upCost = u => Math.round(u.base * costMult() * Math.pow(1.8, S.up[u.k]));

// ---------- pixel icons ----------
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
function shade(hex, d){
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.max(0, Math.min(255, v));
  return `rgb(${c((n>>16)+d)},${c(((n>>8)&255)+d)},${c((n&255)+d)})`;
}
function bevel(g, S){
  g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(0,0,S,1); g.fillRect(0,0,1,S);
  g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(0,S-1,S,1); g.fillRect(S-1,0,1,S);
}
function makeIcon(base, i, seed){
  const S = 16, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d'), r = rng(seed);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    g.fillStyle = shade(base, Math.floor((r() - .5) * (i < 2 ? 46 : 30)));
    g.fillRect(x, y, 1, 1);
  }
  if (i >= 3) { g.fillStyle = 'rgba(255,255,255,.22)'; for (let k = 0; k < 10 + i; k++) g.fillRect(Math.floor(r()*14)+1, Math.floor(r()*14)+1, 2, 2); }
  if (i >= 6) { g.fillStyle = 'rgba(255,255,255,.55)'; [[3,3],[4,3],[3,4],[10,9],[11,9],[10,10],[7,6]].forEach(p => g.fillRect(p[0], p[1], 1, 1)); }
  bevel(g, S);
  return cv.toDataURL();
}
function makeJunk(cracked){
  const S = 16, cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const g = cv.getContext('2d'), r = rng(555);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) { g.fillStyle = shade('#6a6a72', Math.floor((r() - .5) * 36)); g.fillRect(x, y, 1, 1); }
  g.fillStyle = 'rgba(0,0,0,.35)';
  [5, 10].forEach(k => g.fillRect(0, k, S, 1));
  [3, 12].forEach(k => g.fillRect(k, 0, 1, 5)); [7].forEach(k => g.fillRect(k, 5, 1, 5)); [4, 11].forEach(k => g.fillRect(k, 10, 1, 6));
  if (cracked) { g.fillStyle = 'rgba(0,0,0,.85)'; for (let k = 1; k < 15; k++) g.fillRect(k, 2 + Math.floor(k * .85) + (k % 3 === 0 ? 1 : 0), 1, 1); }
  bevel(g, S);
  return cv.toDataURL();
}
const icons = WORLDS.map((w, wi) => w.t.map((c, i) => makeIcon(c[0], i, 1000 + (wi * 10 + i) * 77)));
const junkIcons = [makeJunk(false), makeJunk(true)];

// ---------- state ----------
const fresh = () => ({ board:Array(N).fill(-1), score:0, best:0, coins:0, energy:10, eTs:Date.now(), order:3, world:0,
  disc:[Array(10).fill(0)], up:{energy:0,regen:0,luck:0,auto:0}, spawns:0, paid:0, over:false, autoTs:Date.now(), dayKey:'', streak:0 });
let S = fresh();
let sel = -1, lastAd = Date.now(), ysdk = null;

const mult = () => 1 + 0.5 * S.world;
const wset = () => S.world % 3;
const maxE = () => 10 + 2 * S.up.energy;
const regenMs = () => regenSec(S.up.regen) * 1000;
const autoMs = () => (70 - 10 * S.up.auto) * 1000;
const tierName = i => WORLDS[wset()].t[i][lang === 'ru' ? 1 : 2];
const worldName = w => WORLDS[w % 3][lang];
// difficulty and prices grow a little with every world
const costMult = () => 0.5 + 0.5 * S.world;                                   // world 1: x0.5, 2: x1, 3: x1.5 ...
const regenSec = l => Math.max(12, 40 + 2 * Math.min(S.world, 10) - 5 * l);   // energy comes back slower
const luckP = l => Math.max(.06, .15 + .08 * l - .01 * S.world);              // fewer strong blocks
const orderLo = () => Math.min(6, 3 + S.world);                               // orders ask for higher tiers
const junkFrom = () => Math.max(3, 8 - S.world);                              // rocks start appearing earlier

function ensureDisc(){
  while (S.disc.length <= S.world) S.disc.push(Array(10).fill(0));
  S.disc = S.disc.map(a => (Array.isArray(a) && a.length === 10) ? a : Array(10).fill(0));
}
function load(){
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.board) && d.board.length === N && d.board.every(v => Number.isInteger(v) && ((v >= -1 && v < 10) || v === JUNK || v === CRACK))) {
      S = Object.assign(fresh(), d);
      S.up = Object.assign({ energy:0, regen:0, luck:0, auto:0 }, d.up || {});
      if (!(S.order >= 3 && S.order < 10)) S.order = 3;
      if (!(S.world >= 0)) S.world = 0;
      ensureDisc(); return;
    }
    const o = JSON.parse(localStorage.getItem(OLD)); // migrate best score and collection from v1
    if (o) { S.best = o.best | 0; if (Array.isArray(o.disc) && o.disc.length === 10) S.disc[0] = o.disc.map(v => v ? 1 : 0); }
  } catch (e) {}
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

// ---------- DOM ----------
const boardEl = $('board'), cells = [];
for (let i = 0; i < N; i++) {
  const d = document.createElement('div');
  d.className = 'cell';
  d.innerHTML = '<img alt=""><b></b>';
  d.addEventListener('click', () => tap(i));
  boardEl.appendChild(d);
  cells.push({ d, img: d.firstChild, lv: d.lastChild, key: '' });
}
const collEl = $('coll'), collImgs = [];
for (let i = 0; i < 10; i++) { const im = document.createElement('img'); im.alt = ''; collEl.appendChild(im); collImgs.push(im); }

function applyLang(){
  $('lScore').textContent = t('score'); $('lBest').textContent = t('best'); $('lCoins').textContent = t('coins'); $('lEnergy').textContent = t('energy');
  $('lOrder').textContent = t('order'); $('mine').textContent = t('mine'); $('shop').textContent = t('shop'); $('ad').textContent = t('ad');
  $('bDaily').textContent = t('daily'); $('bWorld').textContent = t('world'); $('bRating').textContent = t('rating');
  $('bSound').textContent = muted ? '🔇' : '🔊';
  $('hint').textContent = t('hint');
}
let toastT;
function toast(msg){
  const e = $('toast'); e.textContent = msg; e.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('show'), 2000);
}
function pop(i){ const d = cells[i].d; d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop'); }

// ---------- sound (synthesized, no audio files) ----------
let actx = null, muted = false, adMuted = false;
try { muted = localStorage.getItem('blockmine_mute') === '1'; } catch (e) {}
function audio(){
  if (!actx) { try { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); } catch (e) {} }
  if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
  return actx;
}
function tone(freq, dur, type, vol, delay, slideTo){
  if (muted || adMuted || document.hidden) return;
  try {
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || .12, t0 + .01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + dur + .03);
  } catch (e) {}
}
const arp = (notes, step, type, vol) => notes.forEach((f, k) => tone(f, .16, type || 'triangle', vol || .12, k * step));
const SFX = {
  click:   () => tone(520, .05, 'square', .05),
  select:  () => tone(660, .06, 'triangle', .09),
  move:    () => tone(440, .09, 'triangle', .09, 0, 330),
  spawn:   () => { tone(300, .07, 'square', .06); tone(450, .09, 'square', .06, .06); },
  merge:   tier => { const f = 330 * Math.pow(2, (tier * 2) / 12); tone(f, .12, 'triangle', .15); tone(f * 1.5, .16, 'triangle', .11, .07); },
  deliver: () => arp([523, 659, 784, 1047], .08, 'triangle', .13),
  treasure:() => arp([523, 659, 784, 1047, 1319, 1568], .07, 'triangle', .13),
  crack:   () => tone(130, .1, 'sawtooth', .08, .12, 70),
  rock:    () => { tone(220, .14, 'sawtooth', .09, .12, 70); tone(160, .12, 'square', .05, .16, 60); },
  buy:     () => { tone(700, .07, 'square', .06); tone(1050, .11, 'square', .06, .07); },
  reward:  () => { tone(880, .08, 'triangle', .1); tone(1320, .14, 'triangle', .1, .08); },
  deny:    () => tone(180, .14, 'sawtooth', .07, 0, 120),
  over:    () => arp([392, 330, 262, 196], .16, 'sawtooth', .08),
  world:   () => arp([262, 330, 392, 523, 659, 784], .09, 'triangle', .12)
};

// ---------- modal ----------
const modalOpen = () => $('modal').classList.contains('show');
function closeModal(){ $('modal').classList.remove('show'); }
function openModal(title, body, btns){
  $('mt').textContent = title;
  const mb = $('mb'); mb.innerHTML = '';
  if (typeof body === 'string') mb.textContent = body; else if (body) mb.appendChild(body);
  const mf = $('mf'); mf.innerHTML = '';
  (btns || []).forEach(b => {
    const e = h('button', b.cls || 'sec', b.text);
    e.addEventListener('click', () => { SFX.click(); if (b.close !== false) closeModal(); if (b.fn) b.fn(); });
    mf.appendChild(e);
  });
  $('modal').classList.add('show');
  return mb;
}

// ---------- render ----------
const canDeliver = () => sel >= 0 && S.board[sel] === S.order;
function render(){
  const ws = wset();
  if (document.documentElement) document.documentElement.className = 'w' + ws;
  cells.forEach((c, i) => {
    const v = S.board[i], key = v + ':' + ws;
    if (c.key !== key) {
      c.key = key;
      if (v < 0) { c.img.style.display = 'none'; c.lv.textContent = ''; }
      else if (v >= JUNK) { c.img.style.display = 'block'; c.img.src = junkIcons[v - JUNK]; c.lv.textContent = ''; }
      else { c.img.style.display = 'block'; c.img.src = icons[ws][v]; c.lv.textContent = v + 1; }
    }
    c.d.classList.toggle('sel', i === sel);
  });
  $('score').textContent = S.score;
  $('best').textContent = S.best;
  $('coins').textContent = S.coins;
  $('oimg').src = icons[ws][S.order];
  $('otext').innerHTML = '';
  $('otext').appendChild(document.createTextNode(tierName(S.order)));
  $('otext').appendChild(h('span', '', canDeliver() ? t('ready') : t('reward')));
  $('order').classList.toggle('ready', canDeliver());
  $('lColl').textContent = t('coll') + ' · ' + (S.world + 1) + '. ' + worldName(S.world);
  collImgs.forEach((im, i) => {
    if (im.dataset.ws !== String(ws)) { im.src = icons[ws][i]; im.dataset.ws = String(ws); }
    im.classList.toggle('lock', !S.disc[S.world][i]);
  });
  $('bDaily').hidden = !dailyAvail();
  $('bWorld').hidden = !S.disc[S.world][9];
  renderEnergy();
}
function renderEnergy(){
  const mx = maxE();
  $('en').textContent = S.energy + (S.energy < mx ? '/' + mx : '');
  $('timer').textContent = S.energy < mx ? '+' + Math.max(0, Math.ceil((regenMs() - (Date.now() - S.eTs)) / 1000)) + t('sec') : '';
  $('mine').classList.toggle('off', S.energy < 1);
}

// ---------- game logic ----------
function tick(){
  const n = Date.now(), mx = maxE();
  if (S.energy >= mx) S.eTs = n;
  else {
    const R = regenMs(), k = Math.floor((n - S.eTs) / R);
    if (k > 0) { S.energy = Math.min(mx, S.energy + k); S.eTs += k * R; if (S.energy >= mx) S.eTs = n; }
  }
  if (S.up.auto > 0 && !S.over) {
    if (n - S.autoTs >= autoMs()) { S.autoTs = n; if (placeBlock(true)) { save(); render(); checkOver(); } }
  } else S.autoTs = n;
}
function add(p){ S.score += Math.round(p * mult()); if (S.score > S.best) S.best = S.score; }
function newOrder(){ const lo = orderLo(); let o; do { o = lo + Math.floor(Math.random() * (9 - lo)); } while (o === S.order); S.order = o; }
function nbrs(i){
  const r = Math.floor(i / COLS), c = i % COLS, o = [];
  if (r > 0) o.push(i - COLS); if (r < ROWS - 1) o.push(i + COLS); if (c > 0) o.push(i - 1); if (c < COLS - 1) o.push(i + 1);
  return o;
}
function crackAround(list){
  const hit = new Set();
  list.forEach(i => nbrs(i).forEach(n => { if (S.board[n] >= JUNK) hit.add(n); }));
  let cr = false, de = false;
  hit.forEach(n => { if (S.board[n] === JUNK) { S.board[n] = CRACK; cr = true; } else { S.board[n] = -1; S.coins += 2; de = true; } });
  if (de) SFX.rock(); else if (cr) SFX.crack();
}
function deliver(i){
  S.board[i] = -1; sel = -1;
  S.energy = Math.min(ABS_E, S.energy + 4); S.coins += Math.round(20 * mult()); add(200);
  toast(t('done') + ' +4 ⚡'); SFX.deliver(); newOrder(); save(); render();
  setTimeout(showInterstitial, 900);
}
function doMerge(to, from){
  const v = S.board[to];
  S.board[from] = -1; sel = -1;
  let deliverNow = false;
  if (v === 9) { S.board[to] = -1; add(1000); S.coins += Math.round(100 * mult()); toast(t('treasure')); SFX.treasure(); }
  else {
    const nv = v + 1;
    S.board[to] = nv; S.disc[S.world][nv] = 1; add((nv + 1) * 10); S.coins += Math.max(1, Math.round(nv * mult()));
    pop(to); SFX.merge(nv); if (nv === S.order) deliverNow = true;
  }
  crackAround([to, from]);
  if (deliverNow) { deliver(to); return; }
  save(); render();
}
function tap(i){
  if (S.over || modalOpen()) return;
  const v = S.board[i];
  if (v >= JUNK) { SFX.deny(); toast(t('junk')); return; }
  if (sel === -1) { if (v >= 0) { sel = i; SFX.select(); } }
  else if (sel === i) { sel = -1; SFX.click(); }
  else if (v === -1) { S.board[i] = S.board[sel]; S.board[sel] = -1; sel = -1; SFX.move(); save(); }
  else if (v === S.board[sel]) { doMerge(i, sel); return; }
  else { sel = i; SFX.select(); }
  render();
}
function pickTier(){
  const l = S.up.luck, p2 = l >= 3 ? .05 * (l - 2) : 0, p1 = luckP(l), r = Math.random();
  return r < p2 ? 2 : (r < p2 + p1 ? 1 : 0);
}
function placeBlock(noJunk){
  const e = []; S.board.forEach((v, i) => { if (v < 0) e.push(i); });
  if (!e.length) return false;
  const i = e[Math.floor(Math.random() * e.length)];
  const jc = (noJunk || S.spawns < junkFrom()) ? 0 : Math.min(.3, .12 + .02 * S.world);
  let v;
  if (Math.random() < jc) v = JUNK; else { v = pickTier(); S.disc[S.world][v] = 1; }
  S.board[i] = v; S.spawns++; pop(i);
  return true;
}
function spawn(){
  if (S.over || modalOpen()) return;
  tick();
  if (S.energy < 1) { SFX.deny(); toast(t('noE')); return; }
  if (!S.board.some(v => v < 0)) { SFX.deny(); toast(t('full')); return; }
  if (S.energy >= maxE()) S.eTs = Date.now();
  S.energy--;
  placeBlock(false); SFX.spawn();
  save(); render(); checkOver();
}
function stuck(){
  if (S.board.some(v => v < 0)) return false;
  const seen = {};
  for (const v of S.board) if (v < JUNK) { if (seen[v]) return false; seen[v] = 1; }
  return true;
}
function checkOver(){
  if (S.over || !stuck()) return;
  S.over = true; sel = -1;
  const b = Math.max(0, Math.floor(S.score / 100) - S.paid);
  S.paid += b; S.coins += b;
  save(); render(); submitScore(); SFX.over();
  openModal(t('overTitle'), t('overText', S.score, S.best, b), [
    { text:t('second'), cls:'ok', close:false, fn:() => showRewarded(() => { closeModal(); secondChance(); }) },
    { text:t('again'), cls:'sec', fn:() => { newRun(); setTimeout(showInterstitial, 400); } }
  ]);
}
function secondChance(){
  for (let i = 0; i < N; i++) if (S.board[i] >= JUNK) S.board[i] = -1;
  const idx = []; S.board.forEach((v, i) => { if (v >= 0) idx.push(i); });
  idx.sort(() => Math.random() - .5).slice(0, 6).forEach(i => { S.board[i] = -1; });
  S.over = false; save(); render(); toast(t('saved')); SFX.reward();
}
function seedBoard(){
  S.board.fill(-1); sel = -1;
  for (let k = 0; k < 4; k++) { const e = []; S.board.forEach((v, i) => { if (v < 0) e.push(i); }); S.board[e[Math.floor(Math.random() * e.length)]] = 0; }
  S.disc[S.world][0] = 1;
}
function newRun(){ seedBoard(); S.score = 0; S.spawns = 0; S.paid = 0; S.over = false; S.order = orderLo(); save(); render(); }
function enterWorld(){
  submitScore();
  S.world++; ensureDisc();
  Object.keys(S.up).forEach(k => { S.up[k] = Math.floor(S.up[k] / 2); });
  S.autoTs = Date.now();
  newRun(); SFX.world();
  toast(worldName(S.world));
}

// ---------- daily bonus ----------
const dayKeyOf = ms => { const d = new Date(ms); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const dailyAvail = () => S.dayKey !== dayKeyOf(Date.now());
function openDaily(){
  const st = S.dayKey === dayKeyOf(Date.now() - 864e5) ? Math.min(S.streak + 1, 7) : 1;
  const c = Math.round((20 + 10 * st) * mult()), e = 5;
  const grant = m => {
    S.coins += c * m; S.energy = Math.min(ABS_E, S.energy + e * m); S.dayKey = dayKeyOf(Date.now()); S.streak = st;
    save(); render(); toast('+' + (c * m) + ' 🪙  +' + (e * m) + ' ⚡'); SFX.reward();
  };
  openModal(t('dailyTitle'), t('dailyText', st, c, e), [
    { text:t('claim'), cls:'gold', fn:() => grant(1) },
    { text:t('claim2'), cls:'ok', close:false, fn:() => showRewarded(() => { closeModal(); grant(2); }) },
    { text:t('close'), cls:'sec' }
  ]);
}

// ---------- shop ----------
function openShop(){
  const body = h('div');
  body.appendChild(h('div', 'coinline', '🪙 ' + S.coins));
  const note = h('div', '', t('shopNote')); note.style.cssText = 'font-size:12px;color:var(--muted);margin-bottom:6px'; body.appendChild(note);
  UPS.forEach(u => {
    const l = S.up[u.k], isMax = l >= u.max, row = h('div', 'up'), nm = h('div', 'nm'), info = I18N[lang]['s_' + u.k];
    nm.appendChild(h('b', '', info[0] + ' · ' + t('lvl') + ' ' + l + '/' + u.max));
    nm.appendChild(h('span', '', isMax ? info[1] + ' — ' + t('maxed') : info[1] + ': ' + u.eff(l)));
    row.appendChild(nm);
    const b = h('button', '', isMax ? t('maxed') : upCost(u) + ' 🪙');
    b.disabled = isMax || S.coins < upCost(u);
    b.addEventListener('click', () => {
      if (S.up[u.k] >= u.max || S.coins < upCost(u)) { SFX.deny(); return; }
      S.coins -= upCost(u); S.up[u.k]++;
      if (u.k === 'auto') S.autoTs = Date.now();
      SFX.buy(); save(); render(); openShop();
    });
    row.appendChild(b); body.appendChild(row);
  });
  openModal(t('shopTitle'), body, [{ text:t('close'), cls:'sec' }]);
}

// ---------- world ----------
function openWorld(){
  const n = S.world + 1;
  openModal(t('worldTitle'), t('worldText', worldName(n), 1 + 0.5 * n), [
    { text:t('go'), cls:'ok', fn:enterWorld },
    { text:t('stay'), cls:'sec' }
  ]);
}

// ---------- leaderboard (Yandex Games) ----------
function submitScore(){
  try { if (ysdk && ysdk.getLeaderboards) ysdk.getLeaderboards().then(lb => lb.setLeaderboardScore('score', S.best)).catch(() => {}); } catch (e) {}
}
function openRating(){
  const body = h('div', '', t('loading'));
  openModal(t('top'), body, [{ text:t('close'), cls:'sec' }]);
  if (!ysdk || !ysdk.getLeaderboards) { body.textContent = t('noLb'); return; }
  submitScore();
  ysdk.getLeaderboards().then(lb => lb.getLeaderboardEntries('score', { quantityTop:10, includeUser:false })).then(res => {
    body.innerHTML = '';
    (res.entries || []).forEach(en => {
      const row = h('div', 'lb');
      row.appendChild(h('span', '', en.rank + '. ' + ((en.player && en.player.publicName) || '—')));
      row.appendChild(h('b', '', String(en.score)));
      body.appendChild(row);
    });
    return ysdk.getPlayer({ scopes:false }).then(p => {
      if (p.getMode && p.getMode() === 'lite' && ysdk.auth) {
        const b = h('button', 'sec', t('login')); b.style.marginTop = '10px'; b.style.width = '100%';
        b.addEventListener('click', () => ysdk.auth.openAuthDialog().then(() => { closeModal(); submitScore(); }).catch(() => {}));
        body.appendChild(b);
      }
    });
  }).catch(() => { body.textContent = t('noLb'); });
}

// ---------- ads (Yandex Games SDK) ----------
function showInterstitial(){
  if (Date.now() - lastAd < 120000) return;
  lastAd = Date.now();
  if (ysdk && ysdk.adv) ysdk.adv.showFullscreenAdv({ callbacks:{ onOpen(){ adMuted = true; }, onClose(){ adMuted = false; }, onError(){ adMuted = false; } } });
}
function showRewarded(cb){
  if (ysdk && ysdk.adv) {
    let ok = false;
    ysdk.adv.showRewardedVideo({ callbacks:{
      onOpen(){ adMuted = true; },
      onRewarded(){ ok = true; },
      onClose(){ adMuted = false; lastAd = Date.now(); if (ok) cb(); },
      onError(){ adMuted = false; toast(t('adErr')); }
    }});
  } else cb(); // local testing without SDK
}

// ---------- init ----------
$('mine').addEventListener('click', spawn);
$('shop').addEventListener('click', () => { if (!modalOpen()) { SFX.click(); openShop(); } });
$('ad').addEventListener('click', () => { if (modalOpen()) return; SFX.click(); showRewarded(() => { S.energy = Math.min(ABS_E, S.energy + 10); save(); render(); toast(t('got')); }); });
$('order').addEventListener('click', () => { if (!S.over && !modalOpen() && canDeliver()) deliver(sel); });
$('bDaily').addEventListener('click', () => { if (!modalOpen() && dailyAvail()) { SFX.click(); openDaily(); } });
$('bWorld').addEventListener('click', () => { if (!modalOpen()) { SFX.click(); openWorld(); } });
$('bRating').addEventListener('click', () => { if (!modalOpen()) { SFX.click(); openRating(); } });
$('bSound').addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('blockmine_mute', muted ? '1' : '0'); } catch (e) {}
  $('bSound').textContent = muted ? '🔇' : '🔊';
  if (!muted) SFX.click();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); try { if (actx) actx.suspend(); } catch (e) {} } });

load(); ensureDisc();
if (S.board.every(v => v < 0)) seedBoard();
tick(); applyLang(); render(); save();
setInterval(() => { tick(); renderEnergy(); }, 1000);
if (S.over) openModal(t('overTitle'), t('overText', S.score, S.best, 0), [
  { text:t('second'), cls:'ok', close:false, fn:() => showRewarded(() => { closeModal(); secondChance(); }) },
  { text:t('again'), cls:'sec', fn:() => newRun() }
]);

if (typeof YaGames !== 'undefined') {
  YaGames.init().then(s => {
    ysdk = s;
    try {
      const l = s.environment.i18n.lang;
      lang = ['ru','be','kk','uk','uz'].includes(l) ? 'ru' : 'en';
      applyLang(); render();
    } catch (e) {}
    try { s.features.LoadingAPI.ready(); } catch (e) {}
  }).catch(() => {});
}
})();
</script>
